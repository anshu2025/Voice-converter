<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Advanced AI Voice Converter</title>

  <script src="https://cdn.tailwindcss.com"></script>

  <style>
    body{
      background: linear-gradient(135deg,#0f172a,#7e22ce);
      min-height:100vh;
      overflow-x:hidden;
    }

    .glass{
      background: rgba(255,255,255,0.08);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255,255,255,0.1);
    }

    textarea::-webkit-scrollbar{
      width:6px;
    }

    textarea::-webkit-scrollbar-thumb{
      background:#9333ea;
      border-radius:10px;
    }

    .voice-card:hover{
      transform: scale(1.03);
      transition: 0.3s;
    }
  </style>
</head>

<body class="flex items-center justify-center p-4 text-white">

  <div class="glass w-full max-w-2xl rounded-3xl p-8 shadow-2xl">

    <h1 class="text-4xl font-bold text-center mb-2">
      🎙️ AI Text & Voice Converter
    </h1>

    <p class="text-center text-gray-300 mb-6">
      Convert Text ➜ Voice OR Voice ➜ Text
    </p>

    <!-- MODE -->
    <div class="grid grid-cols-2 gap-4 mb-6">

      <button id="ttsBtn"
        class="modeBtn bg-purple-600 hover:bg-purple-700 py-3 rounded-xl font-semibold">
        🔊 Text ➜ Voice
      </button>

      <button id="sttBtn"
        class="modeBtn bg-gray-700 hover:bg-gray-600 py-3 rounded-xl font-semibold">
        🎤 Voice ➜ Text
      </button>

    </div>

    <!-- TEXT TO SPEECH -->
    <div id="ttsSection">

      <textarea
        id="text"
        rows="6"
        placeholder="Type something here..."
        class="w-full p-4 rounded-xl bg-gray-900 text-white outline-none resize-none"
      ></textarea>

      <!-- LANGUAGE -->
      <div class="mt-4">
        <label class="font-semibold">🌍 Language</label>

        <select id="language"
          class="w-full mt-2 p-3 rounded-xl bg-gray-900">

          <option value="en-US">English (US)</option>
          <option value="en-GB">English (UK)</option>
          <option value="hi-IN">Hindi</option>
          <option value="fr-FR">French</option>
          <option value="es-ES">Spanish</option>
          <option value="de-DE">German</option>
          <option value="ja-JP">Japanese</option>
          <option value="ko-KR">Korean</option>
          <option value="ru-RU">Russian</option>
          <option value="ar-SA">Arabic</option>

        </select>
      </div>

      <!-- VOICE -->
      <div class="mt-4">
        <label class="font-semibold">🧑 Select Voice</label>

        <select id="voiceSelect"
          class="w-full mt-2 p-3 rounded-xl bg-gray-900">
        </select>
      </div>

      <!-- SPEED -->
      <div class="mt-5">

        <div class="flex justify-between">
          <label class="font-semibold">
            ⚡ Speed
          </label>

          <span id="speedValue">1x</span>
        </div>

        <input
          id="speed"
          type="range"
          min="0.5"
          max="2"
          step="0.1"
          value="1"
          class="w-full mt-2"
        />
      </div>

      <!-- PITCH -->
      <div class="mt-5">

        <div class="flex justify-between">
          <label class="font-semibold">
            🎵 Pitch
          </label>

          <span id="pitchValue">1</span>
        </div>

        <input
          id="pitch"
          type="range"
          min="0"
          max="2"
          step="0.1"
          value="1"
          class="w-full mt-2"
        />
      </div>

      <!-- BUTTONS -->
      <div class="grid grid-cols-3 gap-4 mt-6">

        <button onclick="speakText()"
          class="bg-blue-600 hover:bg-blue-700 py-3 rounded-xl font-bold">
          ▶ Speak
        </button>
<button onclick="downloadText()"
class="mt-4 bg-green-600 hover:bg-green-700 text-white font-bold py-3 px-4 rounded-xl w-full">

⬇ Download Text

</button>
        <button onclick="pauseSpeech()"
          class="bg-yellow-500 hover:bg-yellow-600 py-3 rounded-xl font-bold">
          ⏸ Pause
        </button>

        <button onclick="stopSpeech()"
          class="bg-red-600 hover:bg-red-700 py-3 rounded-xl font-bold">
          ⏹ Stop
        </button>

      </div>

    </div>

    <!-- SPEECH TO TEXT -->
    <div id="sttSection" class="hidden">

      <div class="bg-gray-900 rounded-2xl p-5">

        <p class="text-lg mb-3 font-semibold">
          🎤 Speak Something...
        </p>

        <div id="result"
          class="min-h-[120px] bg-gray-800 p-4 rounded-xl text-gray-200">
          Your speech will appear here...
        </div>

        <button onclick="startRecognition()"
          class="w-full mt-5 bg-green-600 hover:bg-green-700 py-3 rounded-xl font-bold">
          🎙 Start Listening
        </button>
<div class="grid grid-cols-2 gap-4 mt-4">

  <button onclick="startRecognition()"
    class="bg-green-600 hover:bg-green-700 py-3 rounded-xl font-bold w-full">

    🎙 Start Listening

  </button>

  <button onclick="stopRecognition()"
    class="bg-red-600 hover:bg-red-700 py-3 rounded-xl font-bold w-full">

    ⛔ Stop Listening

  </button>

</div>

<!-- PLAY RECORDED TEXT -->
<button onclick="speakResultText()"
class="mt-4 bg-blue-600 hover:bg-blue-700 py-3 rounded-xl font-bold w-full">

🔊 Speak Converted Text

</button>

<!-- VOICE SELECT -->
<select id="resultVoice"
class="w-full mt-4 p-3 rounded-xl bg-gray-900 text-white">

</select>
      </div>

    </div>

  </div>

<script>

  const ttsBtn = document.getElementById("ttsBtn");
  const sttBtn = document.getElementById("sttBtn");

  const ttsSection = document.getElementById("ttsSection");
  const sttSection = document.getElementById("sttSection");

  // TAB SWITCH
  ttsBtn.addEventListener("click", () => {

    ttsSection.classList.remove("hidden");
    sttSection.classList.add("hidden");

    ttsBtn.classList.add("bg-purple-600");
    sttBtn.classList.remove("bg-purple-600");

  });

  sttBtn.addEventListener("click", () => {

    sttSection.classList.remove("hidden");
    ttsSection.classList.add("hidden");

    sttBtn.classList.add("bg-purple-600");
    ttsBtn.classList.remove("bg-purple-600");

  });

  // SPEED
  document.getElementById("speed").addEventListener("input", function () {

    document.getElementById("speedValue").innerText =
      this.value + "x";

  });

  // PITCH
  document.getElementById("pitch").addEventListener("input", function () {

    document.getElementById("pitchValue").innerText =
      this.value;

  });

  // VOICE SYSTEM
  const voiceSelect = document.getElementById("voiceSelect");

  let voices = [];

  function loadVoices() {

    voices = window.speechSynthesis.getVoices();

    voiceSelect.innerHTML = "";

    voices.forEach((voice, index) => {

      const option = document.createElement("option");

      option.value = index;

      option.textContent =
        `${voice.name} (${voice.lang})`;

      voiceSelect.appendChild(option);

    });

  }

  // LOAD VOICES
  window.speechSynthesis.onvoiceschanged = loadVoices;

  loadVoices();

  // SPEAK
  function speakText() {

    const text =
      document.getElementById("text").value.trim();

    if (text === "") {

      alert("Please enter some text!");

      return;

    }

    // STOP OLD SPEECH
    window.speechSynthesis.cancel();

    const utterance =
      new SpeechSynthesisUtterance(text);

    // LANGUAGE
    utterance.lang =
      document.getElementById("language").value;

    // SPEED
    utterance.rate =
      parseFloat(document.getElementById("speed").value);

    // PITCH
    utterance.pitch =
      parseFloat(document.getElementById("pitch").value);

    // SELECTED VOICE
    const selectedVoice =
      voices[voiceSelect.value];

    if (selectedVoice) {

      utterance.voice = selectedVoice;

    }

    // START SPEAKING
    window.speechSynthesis.speak(utterance);

  }

  // PAUSE
  function pauseSpeech() {

    window.speechSynthesis.pause();

  }

  // STOP
  function stopSpeech() {

    window.speechSynthesis.cancel();

  }
let recognition;

// LOAD VOICES FOR RESULT SPEAK
const resultVoice =
  document.getElementById("resultVoice");

function loadResultVoices(){

  const voices =
    speechSynthesis.getVoices();

  resultVoice.innerHTML = "";

  voices.forEach((voice, index)=>{

    const option =
      document.createElement("option");

    let emoji = "🧑";

    if(
      voice.name.toLowerCase().includes("female") ||
      voice.name.toLowerCase().includes("zira") ||
      voice.name.toLowerCase().includes("woman")
    ){
      emoji = "👩";
    }

    if(
      voice.name.toLowerCase().includes("male") ||
      voice.name.toLowerCase().includes("david")
    ){
      emoji = "👨";
    }

    option.value = index;

    option.textContent =
      `${emoji} ${voice.name}`;

    resultVoice.appendChild(option);

  });

}

speechSynthesis.onvoiceschanged =
  loadResultVoices;

loadResultVoices();


// START LISTENING
function startRecognition(){

  const SpeechRecognition =
    window.SpeechRecognition ||
    window.webkitSpeechRecognition;

  if(!SpeechRecognition){

    alert("Speech Recognition not supported!");

    return;

  }

  recognition =
    new SpeechRecognition();

  recognition.lang =
    document.getElementById("language").value;

  recognition.continuous = true;

  recognition.interimResults = true;

  let finalTranscript = "";

  recognition.start();

  document.getElementById("result").innerHTML =
    "🎧 Listening...";

  recognition.onresult = function(event){

    let transcript = "";

    for(
      let i = event.resultIndex;
      i < event.results.length;
      i++
    ){

      transcript +=
        event.results[i][0].transcript;

    }

    finalTranscript = transcript;

    document.getElementById("result").innerHTML =
      finalTranscript;

  };

  recognition.onerror = function(event){

    document.getElementById("result").innerHTML =
      "❌ Error : " + event.error;

  };

}


// STOP LISTENING
function stopRecognition(){

  if(recognition){

    recognition.stop();

    document.getElementById("result").innerHTML +=
      "<br><br>⛔ Listening Stopped";

  }

}


// SPEAK RESULT TEXT
function speakResultText(){

  const text =
    document.getElementById("result").innerText;

  if(text.trim() === ""){

    alert("No converted text found!");

    return;

  }

  speechSynthesis.cancel();

  const utterance =
    new SpeechSynthesisUtterance(text);

  const voices =
    speechSynthesis.getVoices();

  const selectedVoice =
    voices[resultVoice.value];

  if(selectedVoice){

    utterance.voice =
      selectedVoice;

  }

  utterance.rate = 1;

  speechSynthesis.speak(utterance);

}
function downloadText(){

  const text =
    document.getElementById("text").value;

  if(text.trim() === ""){

    alert("Enter text first!");

    return;

  }

  const blob =
    new Blob([text], { type: "text/plain" });

  const a =
    document.createElement("a");

  a.href =
    URL.createObjectURL(blob);

  a.download =
    "voice-text.txt";

  a.click();

}
</script>

</body>
</html>
